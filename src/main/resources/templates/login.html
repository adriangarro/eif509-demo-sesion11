<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión · Administración</title>
  <link rel="stylesheet" href="../static/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body>

<nav class="menu"><span class="marca">EIF509 · Administración</span></nav>

<main class="login">
  <h1>Iniciar sesión</h1>

  <p class="resumen-errores" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
  <p class="ok" th:if="${param.salida}">Sesión cerrada.</p>

  <!-- El POST /login lo atiende Spring Security. th:action agrega el campo
       _csrf; sin él, Spring Security también rechaza el inicio de sesión. -->
  <form class="formulario" th:action="@{/login}" method="post" action="#">
    <label>Correo
      <input type="email" name="username" autocomplete="username" autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <div><button class="boton" type="submit">Entrar</button></div>
  </form>
</main>

</body>
</html>
