# Conexión a la base del docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/eif509
spring.datasource.username=dev
spring.datasource.password=dev

# validate: Hibernate no crea tablas; valida que las entidades coincidan
# con el esquema que Flyway ya construyó (V1..V6).
spring.jpa.hibernate.ddl-auto=validate

# Ver cada SQL que Hibernate envía: en la colección paginada se observa
# el LIMIT/OFFSET que Pageable produce sin código adicional.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Criterio del curso: la entidad no cruza la frontera. Sin "open in view"
# no hay sesión de Hibernate en el controlador; el servicio devuelve DTOs
# ya mapeados dentro de su transacción.
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI (springdoc). La especificación: /v3/api-docs
# Solo documenta la API (/api/**): las vistas MVC no son parte del contrato.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**
