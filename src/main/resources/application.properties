# Conexión a la base del docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/eif509
spring.datasource.username=dev
spring.datasource.password=dev

# validate: Hibernate no crea tablas; valida que las entidades coincidan
# con el esquema que Flyway ya construyó (V1..V7).
spring.jpa.hibernate.ddl-auto=validate

# Ver cada SQL que Hibernate envía: en la colección paginada se observa
# el LIMIT/OFFSET que Pageable produce sin código adicional.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Criterio del curso: la entidad no cruza la frontera. Sin "open in view"
# no hay sesión de Hibernate en el controlador; el servicio devuelve DTOs
# ya mapeados dentro de su transacción.
spring.jpa.open-in-view=false

# Sesión 11: el secreto que firma y verifica los tokens JWT (HS256, al menos
# 32 caracteres). Se lee de la variable de entorno JWT_SECRETO y nunca se
# escribe en el repositorio. Si falta, la aplicación no arranca.
jwt.secreto=${JWT_SECRETO}

# Orígenes que pueden llamar a la API desde un navegador (CORS): la SPA de
# React en desarrollo. En producción se indica el dominio real del frontend.
cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# OpenAPI / Swagger UI (springdoc). La especificación: /v3/api-docs
# Solo documenta la API (/api/** y /auth/**): las vistas MVC no son parte del contrato.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**,/auth/**
