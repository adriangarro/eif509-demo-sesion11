# Perfil exclusivo para la demo: muestra lo que ocurre sin el manejador global
# (@RestControllerAdvice desactivado con @Profile("!sin-manejador")).
# Además, expone la traza y el mensaje en el cuerpo del 500, para verlo
# desde el cliente. No debe usarse en producción: la traza es información
# de implementación y un riesgo de seguridad.
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
